version: 2
updates:
  # JavaScript/Bun dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Group minor/patch updates together to reduce PR noise
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # Rust/Cargo dependencies (for Tauri & WASM)
  - package-ecosystem: 'cargo'
    directory: '/apps/desktop/src-tauri'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    # `ort` is pinned to 2.0.0-rc.12 on purpose. rc.13 renamed the execution
    # provider types (CUDAExecutionProvider -> CUDA, ...) and put each one
    # behind a cargo feature that also selects which prebuilt ONNX Runtime
    # binary `download-binaries` fetches. Enabling `cuda` would pull the
    # multi-GB CUDA distribution, and no Linux distribution ships `migraphx`
    # at all, so the bump needs a deliberate migration rather than a lockfile
    # update. See specs/2026-08-02-ort-rc13-pinned.md -- drop this ignore once
    # that migration lands.
    ignore:
      - dependency-name: 'ort'
    groups:
      rust-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'cargo'
    directory: '/packages/deadstones/src-rust'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'chore(ci)'
