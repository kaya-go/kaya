name: Nightly Build

run-name: Nightly Build (${{ github.event_name == 'schedule' && 'Weekly' || 'Manual' }})

on:
  # Weekly schedule (every Monday at 2:00 AM UTC)
  schedule:
    - cron: '0 2 * * 1'
  # Manual trigger
  workflow_dispatch:
    inputs:
      skip_cache:
        description: 'Skip cache restoration (clean build)'
        required: false
        type: boolean
        default: false

jobs:
  build-macos:
    name: Build macOS
    uses: ./.github/workflows/_build-macos.yml
    with:
      skip-cache: ${{ inputs.skip_cache || false }}
      artifact-name: nightly-macos
      artifact-retention-days: 14
      bun-version: '1.3.2'
    secrets: inherit

  build-windows:
    name: Build Windows
    uses: ./.github/workflows/_build-windows.yml
    with:
      skip-cache: ${{ inputs.skip_cache || false }}
      artifact-name: nightly-windows
      artifact-retention-days: 14
      bun-version: '1.3.2'
    secrets: inherit

  build-linux:
    name: Build Linux
    uses: ./.github/workflows/_build-linux.yml
    with:
      skip-cache: ${{ inputs.skip_cache || false }}
      artifact-name: nightly-linux
      artifact-retention-days: 14
      bun-version: '1.3.2'
    secrets: inherit

  # Generate summary after all builds complete
  summary:
    name: Generate Summary
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List all artifacts
        run: find artifacts -type f | head -100

      - name: Generate build summary
        run: |
          VERSION="${{ needs.build-macos.outputs.version }}"
          SHORT_SHA="${{ needs.build-macos.outputs.short_sha }}"
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Create summary markdown
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # 🌙 Nightly Build Summary

          EOF

          echo "**Version:** \`${VERSION}\` (\`${SHORT_SHA}\`)" >> $GITHUB_STEP_SUMMARY
          echo "**Build Date:** ${BUILD_DATE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📦 Available Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # macOS section
          echo "### 🍎 macOS (Apple Silicon)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          if [ -d "artifacts/nightly-macos" ]; then
            find artifacts/nightly-macos -type f \( -name "*.dmg" -o -name "*.app.tar.gz" \) | while read file; do
              filename=$(basename "$file")
              size=$(ls -lh "$file" | awk '{print $5}')
              echo "| \`$filename\` | $size |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "| *No artifacts found* | - |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Windows section
          echo "### 🪟 Windows (x64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          if [ -d "artifacts/nightly-windows" ]; then
            find artifacts/nightly-windows -type f -name "*.exe" | while read file; do
              filename=$(basename "$file")
              size=$(ls -lh "$file" | awk '{print $5}')
              echo "| \`$filename\` | $size |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "| *No artifacts found* | - |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Linux section
          echo "### 🐧 Linux (x64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          if [ -d "artifacts/nightly-linux" ]; then
            find artifacts/nightly-linux -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) | while read file; do
              filename=$(basename "$file")
              size=$(ls -lh "$file" | awk '{print $5}')
              echo "| \`$filename\` | $size |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "| *No artifacts found* | - |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ⚠️ Important Notes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **These are development builds** and may contain bugs or incomplete features." >> $GITHUB_STEP_SUMMARY
          echo "- **macOS builds are signed and notarized** - they should open without Gatekeeper warnings." >> $GITHUB_STEP_SUMMARY
          echo "- **Windows builds are unsigned** - SmartScreen may show a warning. Click \"More info\" → \"Run anyway\"." >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts are retained for **14 days**." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **To download:** Click on the artifact name in the \"Artifacts\" section below." >> $GITHUB_STEP_SUMMARY
