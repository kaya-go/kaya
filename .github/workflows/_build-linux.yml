name: Build Desktop (Linux AppImage)

# Builds the AppImage bundle. Runs in an Arch Linux container because
# the new Tauri AppImage format (quick-sharun) requires Arch Linux.
# See: https://github.com/tauri-apps/tauri/pull/12491
#
# The .deb and .rpm packages are built separately on Ubuntu 24.04 in
# `_build-linux-deb.yml` to link against an older glibc (Arch's rolling
# glibc 2.43+ otherwise breaks Debian/Ubuntu/Mint users). See #103.
#
# This bundle is the fallback for distros below that .deb/.rpm glibc floor:
# quick-sharun ships glibc and the loader inside the AppImage, so it runs
# on Debian 12, Ubuntu 22.04 and RHEL 9 where the packages correctly refuse
# to install.

on:
  workflow_call:
    inputs:
      skip-cache:
        type: boolean
        default: false
      set-version:
        type: string
        default: ''
      artifact-name:
        type: string
        default: 'desktop-linux'
      artifact-retention-days:
        type: number
        default: 90
      bun-version:
        type: string
        required: true

jobs:
  build:
    name: Build Desktop - Linux (AppImage)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git curl wget unzip \
            clang cmake mold \
            webkit2gtk-4.1 gtk3 libappindicator-gtk3 librsvg \
            alsa-lib \
            patchelf \
            nodejs npm python \
            xorg-server-xvfb zsync

      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Cache node_modules
        if: ${{ !inputs.skip-cache }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
          key: Linux-arch-bun-cache-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            Linux-arch-bun-cache-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Compute Rust cache keys
        id: rust_keys
        shell: bash
        run: |
          RUSTC_HASH=$(rustc -vV | sed -n 's/^commit-hash: //p')
          echo "rustc_hash=$RUSTC_HASH" >> "$GITHUB_OUTPUT"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure Rust build cache env
        id: sccache_config
        shell: bash
        run: |
          SCCACHE_DIR="$HOME/.cache/sccache"
          echo "SCCACHE_DIR=$SCCACHE_DIR" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=2G" >> "$GITHUB_ENV"
          echo "cache_path=$SCCACHE_DIR" >> "$GITHUB_OUTPUT"

      - name: Restore sccache cache
        if: ${{ !inputs.skip-cache }}
        id: sccache_cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ steps.sccache_config.outputs.cache_path }}
          key: Linux-arch-sccache-${{ steps.rust_keys.outputs.rustc_hash }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'packages/deadstones/src-rust/Cargo.lock') }}
          restore-keys: |
            Linux-arch-sccache-${{ steps.rust_keys.outputs.rustc_hash }}-
            Linux-arch-sccache-

      - name: Enable sccache (strict)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sccache >/dev/null 2>&1; then
            echo "sccache not found on PATH" >&2
            exit 1
          fi
          mkdir -p "$SCCACHE_DIR"
          sccache --start-server
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore Cargo registry/git cache
        if: ${{ !inputs.skip-cache }}
        id: cargo_cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: Linux-arch-cargo-${{ steps.rust_keys.outputs.rustc_hash }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'packages/deadstones/src-rust/Cargo.lock') }}
          restore-keys: |
            Linux-arch-cargo-${{ steps.rust_keys.outputs.rustc_hash }}-
            Linux-arch-cargo-

      # Install tauri-cli with new AppImage format (Arch Linux container)
      # Uses the feat/truly-portable-appimage branch which uses quick-sharun
      # See: https://github.com/tauri-apps/tauri/pull/12491
      # TODO: Remove once this is merged into stable tauri-cli release
      #
      # Pinned to an exact rev with --locked rather than tracking the branch tip.
      # Following the tip broke the 2026-08-31 nightly: the unlocked resolve picked
      # up a log/value-bag combination that no longer compiled, so an upstream
      # branch we don't control could fail a release mid-flight. The rev doubles as
      # the cache key, so bumping it rebuilds and every other run reuses the binary
      # instead of spending ~5.5 min recompiling the CLI.
      - name: Pin tauri-cli revision
        id: tauri_cli
        shell: bash
        run: echo "rev=3b69f584e3a32a8607e0c2aa6543a88511085bfb" >> "$GITHUB_OUTPUT"

      - name: Cache tauri-cli
        id: tauri_cli_cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: Linux-arch-tauri-cli-${{ steps.tauri_cli.outputs.rev }}

      - name: Install tauri-cli with new AppImage format
        if: steps.tauri_cli_cache.outputs.cache-hit != 'true'
        run: |
          cargo install tauri-cli \
            --git https://github.com/tauri-apps/tauri \
            --rev "${{ steps.tauri_cli.outputs.rev }}" \
            --locked --force

      - name: Install dependencies
        run: bun install

      - name: Cache wasm-pack
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/wasm-pack*
            ~/wasm-pack-*
          key: Linux-arch-wasm-pack-0.15.0

      - name: Install wasm-pack
        shell: bash
        run: |
          if ! command -v wasm-pack &> /dev/null; then
            cargo install wasm-pack --version 0.15.0 --locked
          fi

      - name: Set version
        if: inputs.set-version != ''
        env:
          KAYA_VERSION: ${{ inputs.set-version }}
        run: bun run set-version "$KAYA_VERSION"

      # Bun's rsbuild crashes with SIGILL in the Arch Linux container.
      # Workaround: pre-build packages with Bun (works fine), then use
      # Node.js/npx for rsbuild, and skip Tauri's beforeBuildCommand.
      # 77 MB from Hugging Face, pulled by every build job on every run. That
      # unauthenticated burst is what got the v0.4.9 release rate-limited (429)
      # mid-build; cached, it is fetched once and reused.
      - name: Cache Moku detection model
        uses: actions/cache@v6
        with:
          path: apps/desktop/public/models
          key: moku-model-v4

      - name: Pre-build frontend
        run: |
          bun run generate-version-info
          bun run copy-assets --with-model
          bun run build:packages
          cd apps/desktop && npx rsbuild build

      - name: Build desktop app (AppImage only)
        working-directory: apps/desktop
        run: cargo tauri build --bundles appimage --config '{"build":{"beforeBuildCommand":""}}'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: 'true'

      - name: Collect artifact info
        shell: bash
        run: |
          echo "Collecting Linux AppImage artifacts..."
          find apps/desktop/src-tauri/target/release/bundle -type f -name "*.AppImage*" -exec ls -lh {} \;

      # Hard gate on the AppImage's one real promise: that it carries everything
      # it needs. A DT_NEEDED that is not bundled works on the build machine and
      # fails on a user's distro, which is the failure this bundle exists to
      # prevent — and the AppDir is right here, before it gets squashed away.
      - name: Check AppImage is self-contained
        shell: bash
        run: |
          APPDIR=$(find apps/desktop/src-tauri/target/release/bundle/appimage \
            -maxdepth 1 -name '*.AppDir' -type d | head -1)
          if [ -z "$APPDIR" ]; then
            echo "::error::no AppDir next to the AppImage"
            exit 1
          fi
          python3 .github/scripts/check-appimage-closure.py "$APPDIR"

      # Only the AppImage and its sidecars. The bundle directory also holds the
      # uncompressed Kaya.AppDir the AppImage was squashed from — ~2.2 GB that
      # nothing downstream reads, and that dominated both upload and the release
      # job's download-all step.
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.zsync
          retention-days: ${{ inputs.artifact-retention-days }}

      # Save caches only when they were not found
      - name: Save Cargo registry/git cache (if miss)
        if: ${{ !inputs.skip-cache && steps.cargo_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}

      - name: Save sccache cache (if miss)
        if: ${{ !inputs.skip-cache && steps.sccache_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ steps.sccache_config.outputs.cache_path }}
          key: ${{ steps.sccache_cache.outputs.cache-primary-key }}
