# Temporary: validates the ort rc.15 migration with a real analysis on every
# desktop OS, which the regular CI cannot do (it stops at `cargo check`).
# Removed before merging.
name: Native inference (temporary)

on:
  pull_request:
    paths:
      - 'apps/desktop/src-tauri/**'

jobs:
  real-analysis:
    name: Real analysis - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev mold clang

      - name: Prepare assets
        run: |
          bun install --frozen-lockfile
          bun run copy-assets --with-model
          mkdir -p apps/desktop/dist
          echo '<html></html>' > apps/desktop/dist/index.html

      # The precision pickQuantization ships on each OS: fp16 on DirectML, fp32 elsewhere.
      - name: Download model
        run: |
          precision=$([ "$RUNNER_OS" = "Windows" ] && echo fp16 || echo fp32)
          curl -fsSL -o "$RUNNER_TEMP/model.onnx" "https://huggingface.co/kaya-go/kaya/resolve/0.2.2/kata1-b28c512nbt-s12043015936-d5616446734/kata1-b28c512nbt-s12043015936-d5616446734.$precision.onnx"
          echo "KAYA_TEST_MODEL=$RUNNER_TEMP/model.onnx" >> "$GITHUB_ENV"

      # Includes the ignored real analysis. The exit code also covers process
      # teardown, since the ONNX Runtime environment is never released.
      - name: Run native tests with a real model
        working-directory: apps/desktop/src-tauri
        run: cargo test --release --lib -- --include-ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/test.log"; test "${PIPESTATUS[0]}" = 0

      - name: Show the analysis
        if: always()
        run: grep -E "^provider=|^mcts |^test result|Execution provider" "$RUNNER_TEMP/test.log" || true

  rust-next:
    name: Rust beta (1.100) - windows-latest
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@beta

      - name: Prepare assets
        run: |
          bun install --frozen-lockfile
          bun run copy-assets --with-model
          mkdir -p apps/desktop/dist
          echo '<html></html>' > apps/desktop/dist/index.html

      - name: Build
        working-directory: apps/desktop/src-tauri
        run: cargo build --release
