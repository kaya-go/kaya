name: Build Desktop (Windows)

on:
  workflow_call:
    inputs:
      skip-cache:
        type: boolean
        default: false
      set-version:
        type: string
        default: ''
      artifact-name:
        type: string
        default: 'desktop-windows'
      artifact-retention-days:
        type: number
        default: 90
      bun-version:
        type: string
        required: true

jobs:
  build:
    name: Build Desktop - Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Cache node_modules
        if: ${{ !inputs.skip-cache }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Compute Rust cache keys
        id: rust_keys
        shell: bash
        run: |
          RUSTC_HASH=$(rustc -vV | sed -n 's/^commit-hash: //p')
          echo "rustc_hash=$RUSTC_HASH" >> "$GITHUB_OUTPUT"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure Rust build cache env
        id: sccache_config
        shell: bash
        run: |
          SCCACHE_DIR="$USERPROFILE/.cache/sccache"
          echo "SCCACHE_DIR=$SCCACHE_DIR" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=2G" >> "$GITHUB_ENV"
          echo "cache_path=$SCCACHE_DIR" >> "$GITHUB_OUTPUT"

      - name: Restore sccache cache
        if: ${{ !inputs.skip-cache }}
        id: sccache_cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ steps.sccache_config.outputs.cache_path }}
          key: ${{ runner.os }}-sccache-${{ steps.rust_keys.outputs.rustc_hash }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'packages/deadstones/src-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-${{ steps.rust_keys.outputs.rustc_hash }}-
            ${{ runner.os }}-sccache-

      - name: Enable sccache (strict)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sccache >/dev/null 2>&1; then
            echo "sccache not found on PATH" >&2
            exit 1
          fi
          mkdir -p "$SCCACHE_DIR"
          sccache --start-server
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore Cargo registry/git cache
        if: ${{ !inputs.skip-cache }}
        id: cargo_cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ steps.rust_keys.outputs.rustc_hash }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'packages/deadstones/src-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust_keys.outputs.rustc_hash }}-
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: bun install

      - name: Cache wasm-pack
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/wasm-pack*
            ~/wasm-pack-*
          key: ${{ runner.os }}-wasm-pack-0.15.0

      - name: Install wasm-pack
        shell: bash
        run: |
          if ! command -v wasm-pack &> /dev/null; then
            cargo install wasm-pack --version 0.15.0 --locked
          fi

      - name: Set version
        if: inputs.set-version != ''
        run: bun run set-version ${{ inputs.set-version }}

      - name: Build desktop app
        run: bun run tauri:build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}

      - name: Collect artifact info
        shell: bash
        run: |
          echo "Collecting Windows artifacts..."
          find apps/desktop/src-tauri/target/release/bundle -type f -name "*.exe" -exec ls -lh {} \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/
          retention-days: ${{ inputs.artifact-retention-days }}

      # Save caches only when they were not found
      - name: Save Cargo registry/git cache (if miss)
        if: ${{ !inputs.skip-cache && steps.cargo_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}

      - name: Save sccache cache (if miss)
        if: ${{ !inputs.skip-cache && steps.sccache_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ steps.sccache_config.outputs.cache_path }}
          key: ${{ steps.sccache_cache.outputs.cache-primary-key }}
