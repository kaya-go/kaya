name: Verify Linux Packages

# Installs the freshly built .deb and .rpm on real distro images and resolves the
# binary's dynamic dependencies there.
#
# Every Linux packaging bug this project has shipped (#103 and its follow-ups)
# looked fine in the build job and only failed on a user's machine: a glibc newer
# than the distro's, or a shared library that was never declared. Nothing in CI
# ever installed the artifacts, so a green build job meant very little.
#
# Each matrix row says whether the install is expected to succeed. The "must
# refuse" rows matter as much as the others: they prove the declared glibc floor
# actually stops the package from landing on a distro it cannot run on, instead
# of letting it install and then die at startup.

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Artifact holding the .deb and .rpm to verify'
        type: string
        required: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Expected to install: at or above the declared glibc floor.
          - name: Ubuntu 24.04 (.deb)
            image: ubuntu:24.04
            kind: deb
            expect: install
          - name: Debian 13 (.deb)
            image: debian:13
            kind: deb
            expect: install
          # `latest` rather than a pinned release: the question is whether the
          # package installs on current Fedora, and a pinned one goes EOL and
          # takes its repo mirrors with it.
          - name: Fedora latest (.rpm)
            image: fedora:latest
            kind: rpm
            expect: install
          # Expected to be refused: glibc 2.36 and 2.34, below the floor.
          - name: Debian 12 (.deb, must refuse)
            image: debian:12
            kind: deb
            expect: refuse
          - name: AlmaLinux 9 (.rpm, must refuse)
            image: almalinux:9
            kind: rpm
            expect: refuse
    steps:
      # git matters more than it looks: without it, actions/checkout falls back to
      # the REST API tarball, and this repo's .gitattributes marks `.github` and
      # `scripts` as export-ignore — so the fallback silently produces a checkout
      # with no scripts in it. The build jobs only work because they install git
      # for other reasons.
      - name: Install git for the checkout
        shell: sh
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eu
          # Distro mirrors 404 on stale repodata for a while after a point release
          # (AlmaLinux 9.8 did exactly that during this work). Retry rather than
          # let somebody else's CDN decide whether our bundles get verified.
          retry() {
            n=0
            until [ "$n" -ge 3 ]; do
              "$@" && return 0
              n=$((n + 1))
              echo "retry $n/3: $*"
              command -v dnf >/dev/null 2>&1 && dnf clean all >/dev/null 2>&1 || true
              sleep 15
            done
            return 1
          }
          if [ "${{ matrix.kind }}" = "deb" ]; then
            retry apt-get update -qq
            retry apt-get install -y --no-install-recommends git ca-certificates
          else
            retry dnf install -y git
          fi

      - uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: packages

      - name: Verify package
        shell: bash
        env:
          KIND: ${{ matrix.kind }}
          EXPECT: ${{ matrix.expect }}
          DEBIAN_FRONTEND: noninteractive
        run: .github/scripts/verify-linux-package.sh packages
