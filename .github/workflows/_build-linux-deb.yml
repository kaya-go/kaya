name: Build Desktop (Linux .deb/.rpm)

# Builds Debian (.deb) and RPM (.rpm) packages on Ubuntu 24.04 so they
# link against glibc 2.39, the oldest version that still satisfies ort's
# prebuilt ONNX Runtime — those binaries reference C23 libc symbols
# (`__isoc23_strtoull`, etc.) that were added in glibc 2.38, so building
# on 22.04 (glibc 2.35) fails at link time with mold "undefined symbol"
# errors. 24.04 covers Ubuntu 24.04+, Debian 13+, Mint 22+, Fedora 40+.
#
# The Arch-based AppImage build (`_build-linux.yml`) inherits Arch's
# bleeding-edge glibc (currently 2.43) which is even newer; AppImage
# bundles its own libs and stays portable. AppImage stays on Arch
# because the new quick-sharun format requires it; .deb/.rpm don't.
# See: https://github.com/kaya-go/kaya/issues/103

on:
  workflow_call:
    inputs:
      skip-cache:
        type: boolean
        default: false
      set-version:
        type: string
        default: ''
      artifact-name:
        type: string
        default: 'desktop-linux-deb'
      artifact-retention-days:
        type: number
        default: 90
      bun-version:
        type: string
        required: true

jobs:
  build:
    name: Build Desktop - Linux (.deb/.rpm)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential clang cmake mold pkg-config \
            curl wget unzip git ca-certificates \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libssl-dev \
            patchelf rpm \
            file sudo

      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      # rsbuild runs under Node, not Bun: `bun run --bun rsbuild build`
      # crashes with SIGILL in this Ubuntu container, the same way it does
      # in the Arch AppImage container (see `_build-linux.yml`). The apt
      # nodejs in the container is too old for @rsbuild/core 2.x, so pull
      # a modern Node from setup-node.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Cache node_modules
        if: ${{ !inputs.skip-cache }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
          key: Linux-ubuntu24-bun-cache-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            Linux-ubuntu24-bun-cache-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Compute Rust cache keys
        id: rust_keys
        shell: bash
        run: |
          RUSTC_HASH=$(rustc -vV | sed -n 's/^commit-hash: //p')
          echo "rustc_hash=$RUSTC_HASH" >> "$GITHUB_OUTPUT"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure Rust build cache env
        id: sccache_config
        shell: bash
        run: |
          SCCACHE_DIR="$HOME/.cache/sccache"
          echo "SCCACHE_DIR=$SCCACHE_DIR" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=2G" >> "$GITHUB_ENV"
          echo "cache_path=$SCCACHE_DIR" >> "$GITHUB_OUTPUT"

      - name: Restore sccache cache
        if: ${{ !inputs.skip-cache }}
        id: sccache_cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ steps.sccache_config.outputs.cache_path }}
          key: Linux-ubuntu24-sccache-${{ steps.rust_keys.outputs.rustc_hash }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'packages/deadstones/src-rust/Cargo.lock') }}
          restore-keys: |
            Linux-ubuntu24-sccache-${{ steps.rust_keys.outputs.rustc_hash }}-
            Linux-ubuntu24-sccache-

      - name: Enable sccache (strict)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sccache >/dev/null 2>&1; then
            echo "sccache not found on PATH" >&2
            exit 1
          fi
          mkdir -p "$SCCACHE_DIR"
          sccache --start-server
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore Cargo registry/git cache
        if: ${{ !inputs.skip-cache }}
        id: cargo_cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: Linux-ubuntu24-cargo-${{ steps.rust_keys.outputs.rustc_hash }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'packages/deadstones/src-rust/Cargo.lock') }}
          restore-keys: |
            Linux-ubuntu24-cargo-${{ steps.rust_keys.outputs.rustc_hash }}-
            Linux-ubuntu24-cargo-

      # Stable tauri-cli is fine for .deb/.rpm — the truly-portable AppImage
      # fork is only required for the AppImage bundle, which we don't produce here.
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked --force

      - name: Install dependencies
        run: bun install

      - name: Cache wasm-pack
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/wasm-pack*
            ~/wasm-pack-*
          key: Linux-ubuntu24-wasm-pack-0.15.0

      - name: Install wasm-pack
        shell: bash
        run: |
          if ! command -v wasm-pack &> /dev/null; then
            cargo install wasm-pack --version 0.15.0 --locked
          fi

      - name: Set version
        if: inputs.set-version != ''
        env:
          KAYA_VERSION: ${{ inputs.set-version }}
        run: bun run set-version "$KAYA_VERSION"

      # Bun's rsbuild crashes with SIGILL in this container too, so mirror
      # the AppImage workflow: pre-build packages with Bun (works fine),
      # then use Node.js/npx for rsbuild.
      - name: Pre-build frontend
        run: |
          bun run generate-version-info
          bun run copy-assets
          bun run build:packages
          cd apps/desktop && npx rsbuild build

      - name: Build desktop app (.deb + .rpm)
        working-directory: apps/desktop
        run: cargo tauri build --bundles deb,rpm --config '{"build":{"beforeBuildCommand":""}}'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}

      - name: Collect artifact info
        shell: bash
        run: |
          echo "Collecting Linux .deb/.rpm artifacts..."
          find apps/desktop/src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.rpm" \) -exec ls -lh {} \;
          echo ""
          echo "Verifying glibc compatibility of the binary..."
          BIN=$(find apps/desktop/src-tauri/target/release -maxdepth 1 -type f -executable | head -1)
          if [ -n "$BIN" ]; then
            echo "Binary: $BIN"
            objdump -T "$BIN" 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -V -u | tail -5 || true
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/
            apps/desktop/src-tauri/target/release/bundle/rpm/
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Save Cargo registry/git cache (if miss)
        if: ${{ !inputs.skip-cache && steps.cargo_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}

      - name: Save sccache cache (if miss)
        if: ${{ !inputs.skip-cache && steps.sccache_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ steps.sccache_config.outputs.cache_path }}
          key: ${{ steps.sccache_cache.outputs.cache-primary-key }}
