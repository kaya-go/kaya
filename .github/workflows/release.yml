name: Release

run-name: Release v${{ github.event.inputs.version }}

# Only manual trigger - creates tag, builds, and releases all in one workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0) - without v prefix'
        required: true
        type: string

env:
  BUN_VERSION: '1.3.2'

jobs:
  # First verify everything builds correctly
  verify:
    name: Verify Build Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install dependencies
        run: bun install

      # Install Rust for WASM compilation
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache wasm-pack
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-pack*
          key: ${{ runner.os }}-wasm-pack-0.13

      - name: Install wasm-pack
        run: command -v wasm-pack || curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Set version to ${{ github.event.inputs.version }}
        run: bun run set-version ${{ github.event.inputs.version }}

      - name: Check formatting
        run: bun run format:check

      # Build packages first so type declarations are available
      - name: Build packages
        run: bun run build:packages

      - name: Type check
        run: bun run type-check

      - name: Run tests
        run: bun run test

      - name: ✅ Verification passed
        run: echo "All quality checks passed! Ready to build and release."

  deploy-web:
    name: Deploy Web App (Stable)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NODE_ENV: production
      ASSET_PREFIX: /
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install dependencies
        run: bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache wasm-pack
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-pack*
          key: ${{ runner.os }}-wasm-pack-0.13

      - name: Install wasm-pack
        run: command -v wasm-pack || curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Set version to ${{ github.event.inputs.version }}
        run: bun run set-version ${{ github.event.inputs.version }}

      - name: Build packages
        run: bun run build:packages

      - name: Build Web App
        run: bun run build:web

      # Robust deployment: checkout gh-pages, clean root (keep next/), copy new build
      - name: Checkout gh-pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages

      - name: Clean root and copy new build (preserve next/)
        run: |
          # Save next/ folder if it exists
          if [ -d gh-pages/next ]; then
            mv gh-pages/next /tmp/next-backup
          fi
          # Clean everything in gh-pages
          rm -rf gh-pages/*
          # Copy new build
          cp -r apps/web/dist/* gh-pages/
          # Restore next/ folder
          if [ -d /tmp/next-backup ]; then
            mv /tmp/next-backup gh-pages/next
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          cname: kayago.app
          keep_files: false

  build-macos:
    name: Build macOS
    needs: verify
    uses: ./.github/workflows/_build-macos.yml
    with:
      set-version: ${{ github.event.inputs.version }}
      artifact-name: desktop-macos
      bun-version: '1.3.2'
    secrets: inherit

  build-windows:
    name: Build Windows
    needs: verify
    uses: ./.github/workflows/_build-windows.yml
    with:
      set-version: ${{ github.event.inputs.version }}
      artifact-name: desktop-windows
      bun-version: '1.3.2'
    secrets: inherit

  build-linux:
    name: Build Linux (x86_64)
    needs: verify
    uses: ./.github/workflows/_build-linux.yml
    with:
      set-version: ${{ github.event.inputs.version }}
      arch: x86_64
      artifact-name: desktop-linux
      bun-version: '1.3.2'
    secrets: inherit

  build-linux-arm64:
    name: Build Linux (aarch64)
    needs: verify
    uses: ./.github/workflows/_build-linux.yml
    with:
      set-version: ${{ github.event.inputs.version }}
      arch: aarch64
      artifact-name: desktop-linux-arm64
      bun-version: '1.3.2'
    secrets: inherit

  # Commit version bump and create release ONLY after successful builds
  commit-and-release:
    name: Commit Version & Create Release
    needs: [build-macos, build-windows, build-linux, build-linux-arm64, deploy-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Set version to ${{ github.event.inputs.version }}
        run: bun run set-version ${{ github.event.inputs.version }}

      - name: Generate changelog from commits
        id: changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate full changelog (skip_tags in cliff.toml handles old versions)
          bun run git-cliff --tag "v${{ github.event.inputs.version }}" -o CHANGELOG.md

          # Generate release notes for this version only
          bun run git-cliff --tag "v${{ github.event.inputs.version }}" --unreleased --strip header -o CHANGELOG-NEW.md

          # Read the generated changelog for GitHub release
          CHANGELOG=$(cat CHANGELOG-NEW.md)

          # Escape for GitHub output (handle multiline)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Remove temporary file
          rm CHANGELOG-NEW.md

      - name: Commit and push version changes + changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Format files before committing (fixes CHANGELOG.md issues)
          bun run format

          git add .
          git commit -m "chore: release v${{ github.event.inputs.version }}"
          git pull --rebase
          git push

      - name: Create and push tag
        run: |
          git tag -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Generate updater JSON
        run: |
          # Generate latest.json for Tauri updater
          bun run generate-updater-json "${{ github.event.inputs.version }}" "${{ steps.changelog.outputs.changelog }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          files: |
            desktop-macos/**/*.dmg
            desktop-macos/**/*.dmg.sig
            desktop-macos/**/*.app.tar.gz
            desktop-macos/**/*.app.tar.gz.sig
            desktop-linux/**/*.deb
            desktop-linux/**/*.rpm
            desktop-linux/**/*.AppImage
            desktop-linux/**/*.AppImage.sig
            desktop-linux-arm64/**/*.deb
            desktop-linux-arm64/**/*.rpm
            desktop-linux-arm64/**/*.AppImage
            desktop-linux-arm64/**/*.AppImage.sig
            desktop-windows/**/*.exe
            desktop-windows/**/*.exe.sig
            latest.json
          draft: true
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ---

            ## Downloads

            | Platform | Installer | Signature |
            | -------- | --------- | --------- |
            | **macOS** (Apple Silicon) | [.dmg](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/Kaya_${{ github.event.inputs.version }}_aarch64.dmg) | [.sig](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/Kaya_${{ github.event.inputs.version }}_aarch64.dmg.sig) |
            | **Windows** (x64) | [.exe](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/Kaya_${{ github.event.inputs.version }}_x64-setup.exe) | [.sig](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/Kaya_${{ github.event.inputs.version }}_x64-setup.exe.sig) |
            | **Linux x64** (AppImage) | [.AppImage](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/Kaya_${{ github.event.inputs.version }}_amd64.AppImage) | [.sig](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/Kaya_${{ github.event.inputs.version }}_amd64.AppImage.sig) |
            | **Linux x64** (Debian/Ubuntu) | [.deb](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/kaya_${{ github.event.inputs.version }}_amd64.deb) | - |
            | **Linux x64** (Fedora/RHEL) | [.rpm](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/kaya-${{ github.event.inputs.version }}-1.x86_64.rpm) | - |
            | **Linux ARM64** (AppImage) | [.AppImage](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/Kaya_${{ github.event.inputs.version }}_aarch64.AppImage) | [.sig](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/Kaya_${{ github.event.inputs.version }}_aarch64.AppImage.sig) |
            | **Linux ARM64** (Debian/Ubuntu) | [.deb](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/kaya_${{ github.event.inputs.version }}_arm64.deb) | - |
            | **Linux ARM64** (Fedora/RHEL) | [.rpm](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/kaya-${{ github.event.inputs.version }}-1.aarch64.rpm) | - |

  bump-dev-version:
    name: Bump to Next Dev Version
    needs: commit-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Calculate next version
        id: next_version
        run: |
          CURRENT_VERSION="${{ github.event.inputs.version }}"
          # Split into parts
          IFS='.' read -r -a parts <<< "$CURRENT_VERSION"
          MAJOR="${parts[0]}"
          MINOR="${parts[1]}"
          PATCH="${parts[2]}"

          # Increment patch
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="$MAJOR.$MINOR.$NEXT_PATCH-dev"

          echo "Next version: $NEXT_VERSION"
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Set version to next dev
        run: bun run set-version ${{ steps.next_version.outputs.version }}

      - name: Commit and push dev bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: bump version to ${{ steps.next_version.outputs.version }}"
          git pull --rebase
          git push
