name: Release

run-name: Release v${{ github.event.inputs.version }}

# Only manual trigger - creates tag, builds, and releases all in one workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0) - without v prefix'
        required: true
        type: string

env:
  BUN_VERSION: '1.3.2'

jobs:
  # First verify everything builds correctly
  verify:
    name: Verify Build Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install dependencies
        run: bun install

      # Install Rust for WASM compilation
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache wasm-pack
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-pack*
          key: ${{ runner.os }}-wasm-pack-0.15.0

      - name: Install wasm-pack
        run: command -v wasm-pack || cargo install wasm-pack --version 0.15.0 --locked

      - name: Set version
        env:
          KAYA_VERSION: ${{ github.event.inputs.version }}
        run: bun run set-version "$KAYA_VERSION"

      - name: Check formatting
        run: bun run format:check

      # Build packages first so type declarations are available
      - name: Build packages
        run: bun run build:packages

      - name: Type check
        run: bun run type-check

      - name: Run tests
        run: bun run test

      - name: Verification passed
        run: echo "All quality checks passed! Ready to build and release."

  deploy-web:
    name: Deploy Web App (Stable)
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      NODE_ENV: production
      ASSET_PREFIX: /
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install dependencies
        run: bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache wasm-pack
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-pack*
          key: ${{ runner.os }}-wasm-pack-0.15.0

      - name: Install wasm-pack
        run: command -v wasm-pack || cargo install wasm-pack --version 0.15.0 --locked

      - name: Set version
        env:
          KAYA_VERSION: ${{ github.event.inputs.version }}
        run: bun run set-version "$KAYA_VERSION"

      - name: Build packages
        run: bun run build:packages

      - name: Build Web App
        run: bun run build:web

      # Checkout gh-pages branch to preserve next/ content
      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Clean root and copy new build (preserve next/)
        run: |
          # Save next/ folder if it exists
          if [ -d gh-pages/next ]; then
            mv gh-pages/next /tmp/next-backup
          fi
          # Clean everything in gh-pages
          rm -rf gh-pages/.git
          rm -rf gh-pages/*
          # Copy new build
          cp -r apps/web/dist/* gh-pages/
          # Restore next/ folder
          if [ -d /tmp/next-backup ]; then
            mv /tmp/next-backup gh-pages/next
          fi

      - name: Add CNAME
        run: echo "kayago.app" > gh-pages/CNAME

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KAYA_VERSION: ${{ github.event.inputs.version }}
        run: |
          cd gh-pages
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy v${KAYA_VERSION}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  build-macos:
    name: Build macOS
    needs: verify
    uses: ./.github/workflows/_build-macos.yml
    with:
      set-version: ${{ github.event.inputs.version }}
      artifact-name: desktop-macos
      bun-version: '1.3.2'
    secrets: inherit

  build-windows:
    name: Build Windows
    needs: verify
    uses: ./.github/workflows/_build-windows.yml
    with:
      set-version: ${{ github.event.inputs.version }}
      artifact-name: desktop-windows
      bun-version: '1.3.2'
    secrets: inherit

  build-linux:
    name: Build Linux (AppImage)
    needs: verify
    uses: ./.github/workflows/_build-linux.yml
    with:
      set-version: ${{ github.event.inputs.version }}
      artifact-name: desktop-linux
      bun-version: '1.3.2'
    secrets: inherit

  build-linux-deb:
    name: Build Linux (.deb/.rpm)
    needs: verify
    uses: ./.github/workflows/_build-linux-deb.yml
    with:
      set-version: ${{ github.event.inputs.version }}
      artifact-name: desktop-linux-deb
      bun-version: '1.3.2'
    secrets: inherit

  # Commit version bump and create release ONLY after successful builds
  commit-and-release:
    name: Commit Version & Create Release
    needs: [build-macos, build-windows, build-linux, build-linux-deb, deploy-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Set version
        env:
          KAYA_VERSION: ${{ github.event.inputs.version }}
        run: bun run set-version "$KAYA_VERSION"

      - name: Generate changelog from commits
        id: changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KAYA_VERSION: ${{ github.event.inputs.version }}
        run: |
          # Generate full changelog (skip_tags in cliff.toml handles old versions)
          bun run git-cliff --tag "v${KAYA_VERSION}" -o CHANGELOG.md

          # Generate release notes for this version only
          bun run git-cliff --tag "v${KAYA_VERSION}" --unreleased --strip header -o CHANGELOG-NEW.md

          # Read the generated changelog for GitHub release
          CHANGELOG=$(cat CHANGELOG-NEW.md)

          # Escape for GitHub output (handle multiline)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Remove temporary file
          rm CHANGELOG-NEW.md

      - name: Commit and push version changes + changelog
        env:
          KAYA_VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Format files before committing (fixes CHANGELOG.md issues)
          bun run format

          git add .
          git commit -m "chore: release v${KAYA_VERSION}"
          git pull --rebase
          git push

      - name: Create and push tag
        env:
          KAYA_VERSION: ${{ github.event.inputs.version }}
        run: |
          git tag -a "v${KAYA_VERSION}" -m "Release v${KAYA_VERSION}"
          git push origin "v${KAYA_VERSION}"

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Generate updater JSON
        env:
          KAYA_VERSION: ${{ github.event.inputs.version }}
          KAYA_CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          # Generate latest.json for Tauri updater
          bun run generate-updater-json "$KAYA_VERSION" "$KAYA_CHANGELOG"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          files: |
            desktop-macos/**/*.dmg
            desktop-macos/**/*.dmg.sig
            desktop-macos/**/*.app.tar.gz
            desktop-macos/**/*.app.tar.gz.sig
            desktop-linux/**/*.AppImage
            desktop-linux/**/*.AppImage.sig
            desktop-linux-deb/**/*.deb
            desktop-linux-deb/**/*.rpm
            desktop-windows/**/*.exe
            desktop-windows/**/*.exe.sig
            latest.json
          draft: true
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ---

            ## Downloads

            | Platform | Installer | Signature |
            | -------- | --------- | --------- |
            | **macOS** (Apple Silicon) | [.dmg](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/Kaya_${{ github.event.inputs.version }}_aarch64.dmg) | [.sig](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/Kaya_${{ github.event.inputs.version }}_aarch64.dmg.sig) |
            | **Windows** (x64) | [.exe](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/Kaya_${{ github.event.inputs.version }}_x64-setup.exe) | [.sig](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/Kaya_${{ github.event.inputs.version }}_x64-setup.exe.sig) |
            | **Linux** (AppImage) | [.AppImage](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/Kaya_${{ github.event.inputs.version }}_amd64.AppImage) | [.sig](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/Kaya_${{ github.event.inputs.version }}_amd64.AppImage.sig) |
            | **Linux** (Debian/Ubuntu) | [.deb](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/kaya_${{ github.event.inputs.version }}_amd64.deb) | - |
            | **Linux** (Fedora/RHEL) | [.rpm](https://github.com/kaya-go/kaya/releases/download/v${{ github.event.inputs.version }}/kaya-${{ github.event.inputs.version }}-1.x86_64.rpm) | - |

  bump-dev-version:
    name: Bump to Next Dev Version
    needs: commit-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Calculate next version
        id: next_version
        env:
          KAYA_VERSION: ${{ github.event.inputs.version }}
        run: |
          CURRENT_VERSION="$KAYA_VERSION"
          # Split into parts
          IFS='.' read -r -a parts <<< "$CURRENT_VERSION"
          MAJOR="${parts[0]}"
          MINOR="${parts[1]}"
          PATCH="${parts[2]}"

          # Increment patch
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="$MAJOR.$MINOR.$NEXT_PATCH-dev"

          echo "Next version: $NEXT_VERSION"
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Set version to next dev
        env:
          KAYA_NEXT_VERSION: ${{ steps.next_version.outputs.version }}
        run: bun run set-version "$KAYA_NEXT_VERSION"

      - name: Commit and push dev bump
        env:
          KAYA_NEXT_VERSION: ${{ steps.next_version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: bump version to ${KAYA_NEXT_VERSION}"
          git pull --rebase
          git push
