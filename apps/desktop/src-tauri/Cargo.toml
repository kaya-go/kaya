[package]
name = "kaya"
version = "0.3.8-dev"
description = "A beautiful Go game application with AI analysis powered by KataGo"
authors = ["Kaya Team"]
license = "AGPL-3.0"
repository = "https://github.com/kaya-go/kaya"
edition = "2021"

[lib]
name = "kaya"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
base64 = "0.22"
# ONNX Runtime - shared dependencies
# Must match ndarray version used by ort (0.17.x)
ndarray = "0.17"
half = "2.7"

# Audio playback — bypasses WebKitGTK/GStreamer entirely (which is broken in AppImage)
# Uses ALSA/PulseAudio on Linux, CoreAudio on macOS, WASAPI on Windows
# Not needed on Android (audio is handled via WebView)
[target.'cfg(not(target_os = "android"))'.dependencies]
rodio = { version = "0.22", default-features = false, features = ["playback", "lewton"] }

# Linux desktop: static linking (same as macOS/Windows) for zero-dependency deployment.
# Power users can override with ORT_DYLIB_PATH for MIGraphX/CUDA GPU support.
[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "half"] }
reqwest = { version = "0.13", features = ["stream"] }
tauri-plugin-http = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2.4.1"

# Non-Linux desktop (macOS, Windows): static linking with download-binaries
[target.'cfg(all(not(target_os = "android"), not(target_os = "linux")))'.dependencies]
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "half"] }
reqwest = { version = "0.13", features = ["stream"] }
tauri-plugin-http = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2.4.1"

# Android: dynamic loading at runtime (we bundle libonnxruntime.so in the APK)
[target.'cfg(target_os = "android")'.dependencies]
# default-features = false to disable download-binaries which doesn't work for Android
# api-24 is required so ort-sys generates full API bindings (VitisAI EP etc.)
ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic", "ndarray", "half", "api-24"] }
# Note: reqwest is NOT included for Android to avoid OpenSSL/ring compilation issues
# HTTP requests on Android should be done via the frontend/WebView

# Deny all warnings to enforce clean builds
[lints.rust]
unused = "deny"

# Optimize release builds for smaller binary and faster CI
[profile.release]
# Enable LTO for smaller binary (thin is faster than full LTO)
lto = "thin"
# Strip debug info for smaller binary
strip = false
# Use multiple codegen units for faster parallel compilation
# Trade-off: slightly larger binary but much faster builds
codegen-units = 16
