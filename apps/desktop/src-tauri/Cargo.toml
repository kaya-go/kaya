[package]
name = "kaya"
version = "0.4.13"
description = "A beautiful Go game application with AI analysis powered by KataGo"
authors = ["Kaya Team"]
license = "AGPL-3.0"
repository = "https://github.com/kaya-go/kaya"
edition = "2021"

[lib]
name = "kaya"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
base64 = "0.23"
# ONNX Runtime - shared dependencies
# Must match ndarray version used by ort (0.17.x)
ndarray = "0.17"
half = "2.7"

# Audio playback — bypasses WebKitGTK/GStreamer entirely (which is broken in AppImage)
# Uses ALSA/PulseAudio on Linux, CoreAudio on macOS, WASAPI on Windows
# Not needed on Android (audio is handled via WebView)
#
# reqwest and the updater/window-state plugins are desktop-only too: Android
# would drag in OpenSSL/ring, and HTTP there goes through the WebView instead.
[target.'cfg(not(target_os = "android"))'.dependencies]
rodio = { version = "0.22", default-features = false, features = ["playback", "lewton"] }
reqwest = { version = "0.13", features = ["stream"] }
tauri-plugin-http = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2.4.1"

# ONNX Runtime. An EP feature is what makes that provider's register() do
# anything — without it ort returns RegisterError::MissingFeature and the
# session silently runs on CPU (#145, specs/2026-09-12-ep-cargo-features.md).
#
# Since rc.13 those same features ALSO select which prebuilt binary
# `download-binaries` fetches: `resolve_dist()` matches the requested set
# against a table of published distributions, and a set nothing satisfies
# fails at LINK time (not at `cargo check` time, which is all CI runs). So the
# features are declared per target rather than once for all desktops, and each
# set is one a published distribution actually carries.
# See specs/2026-09-12-ort-rc13-migration.md.

# Linux: the plain CPU distribution. No Linux build ships MIGraphX, the CUDA one
# is a multi-GB download that expects a CUDA runtime on the user's machine, and
# ORT_DYLIB_PATH is ignored unless ort is built with `load-dynamic`. The GPU
# path on Linux is the PyTorch sidecar (specs/2026-02-28-pytorch-sidecar-rocm.md).
[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["download-binaries", "half"] }

# macOS: `coreml` does not change the download — with an empty feature set
# `resolve_dist()` already resolves the `coreml` distribution, the only one
# published for aarch64-apple-darwin. It only unlocks the registration call,
# exactly like `directml` on Windows. Measured on an M3 Max against the CPU EP
# (specs/2026-09-12-coreml-on-by-default-macos.md): 4.2x throughput at the
# batch size MCTS uses, for ~8s of one-off model compilation on a cold cache.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["download-binaries", "half", "coreml"] }

# Windows: the x86_64-pc-windows-msvc distribution ships DirectML.dll and the
# build script links the DX12 libraries, so `directml` only unlocks the
# registration call.
[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["download-binaries", "half", "directml"] }

# Android: dynamic loading at runtime (we bundle libonnxruntime.so in the APK).
# default-features = false disables download-binaries, which doesn't work for
# Android — nothing is fetched, so `nnapi` here is pure API gating.
# api-24 matches the ONNX Runtime 1.24.3 AAR pulled by
# scripts/download-onnxruntime-android.sh.
[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray", "half", "api-24", "nnapi"] }
# Note: reqwest is NOT included for Android to avoid OpenSSL/ring compilation issues
# HTTP requests on Android should be done via the frontend/WebView

# Deny all warnings to enforce clean builds
[lints.rust]
unused = "deny"

# Optimize release builds for smaller binary and faster CI
[profile.release]
# Enable LTO for smaller binary (thin is faster than full LTO)
lto = "thin"
# Strip debug info for smaller binary
strip = false
# Use multiple codegen units for faster parallel compilation
# Trade-off: slightly larger binary but much faster builds
codegen-units = 16
